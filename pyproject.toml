[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwvault"
version = "0.1.0"
description = "A small, offline, command-line password manager (learning project)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pynacl>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pwvault = "pwvault.cli:main"

[tool.setuptools]
packages = ["pwvault"]
